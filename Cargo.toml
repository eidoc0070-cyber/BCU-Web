[workspace]
resolver = "2"
members = [
    "crates/bcu-math",
    "crates/bcu-core",
    "crates/bcu-parser",
    "crates/bcu-assets",
    "crates/bcu-render",
    "crates/bcu-api",
    "tools/parity-tester",
]

[workspace.dependencies]
bcu-math = { path = "crates/bcu-math" }
bcu-core = { path = "crates/bcu-core" }
bcu-parser = { path = "crates/bcu-parser" }
bcu-assets = { path = "crates/bcu-assets" }
bcu-render = { path = "crates/bcu-render" }
bcu-api = { path = "crates/bcu-api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "0.19", features = ["webgl"] }
js-sys = "0.3"
console_error_panic_hook = "0.1"
log = "0.4"
ts-rs = { version = "8.1", features = ["serde-compat"] }
