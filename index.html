<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BCU Rust - Editor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07080d;
      --bg-panel: rgba(13, 15, 26, 0.7);
      --bg-card: rgba(22, 25, 44, 0.65);
      --border-color: rgba(255, 255, 255, 0.06);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: hsl(250, 85%, 65%);
      --accent-hover: hsl(250, 90%, 70%);
      --accent-gradient: linear-gradient(135deg, hsl(263, 85%, 65%), hsl(220, 85%, 60%));
      --accent-glow: rgba(139, 92, 246, 0.25);
      --card-radius: 12px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 50%, #111322 0%, var(--bg-dark) 100%);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    .editor-layout {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* Sidebar Styles */
    .editor-sidebar {
      width: 290px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(20px);
      z-index: 10;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .sidebar-right {
      width: 310px;
      border-right: none;
      border-left: 1px solid var(--border-color);
      box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5);
    }

    .sidebar-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.15);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
    }

    /* Tabs */
    .tab-container {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.25);
    }

    .tab-btn {
      flex: 1;
      padding: 0.85rem;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: 'Outfit', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border-bottom: 2px solid transparent;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tab-btn:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.02);
    }

    .tab-btn.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent);
      background: rgba(139, 92, 246, 0.08);
      text-shadow: 0 0 10px var(--accent-glow);
    }

    /* Parts Item */
    .part-item {
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.35rem;
      border-radius: var(--card-radius);
      background: var(--bg-card);
      font-size: 0.8rem;
      cursor: pointer;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      transition: var(--transition);
    }
    
    .part-item:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    /* Buttons */
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      color: white;
    }
    
    .primary-btn {
      background: var(--accent-gradient);
      box-shadow: 0 4px 15px var(--accent-glow);
    }
    
    .primary-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .secondary-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    /* Main Viewport Styles */
    .viewport-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
      background: #040508;
    }

    .canvas-wrapper {
      flex: 1;
      position: relative;
    }
    canvas { width: 100%; height: 100%; display: block; }

    /* Control Bar */
    .control-bar {
      height: 85px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 2rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
    }

    .play-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--accent-gradient);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      box-shadow: 0 4px 15px var(--accent-glow);
      font-size: 1rem;
    }
    
    .play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .timeline-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .frame-slider {
      width: 100%;
      cursor: pointer;
      accent-color: var(--accent);
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      outline: none;
    }

    /* Console */
    .logger-console {
      height: 140px;
      background: rgba(4, 5, 8, 0.85);
      border-top: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 0.75rem;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 0.75rem;
      line-height: 1.4;
      border-bottom: 4px solid var(--bg-panel);
    }
    
    .log-line {
      margin-bottom: 4px;
      border-left: 2px solid transparent;
      padding-left: 6px;
    }
    
    .log-line.info {
      color: #60a5fa;
      border-left-color: #3b82f6;
    }
    
    .log-line.error {
      color: #f87171;
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.05);
    }

    /* Overlay */
    .drag-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(139, 92, 246, 0.15);
      border: 4px dashed var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      pointer-events: none;
      backdrop-filter: blur(4px);
      transition: var(--transition);
    }
    .drag-overlay.active { display: flex; }
    
    /* File Items */
    .file-item {
      transition: var(--transition);
      border: 1px solid transparent;
    }
    
    .file-item:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.08);
      padding-left: 1rem !important;
    }

  </style>
</head>
<body>

    <div class="editor-layout">
      <!-- Left Sidebar -->
      <aside class="editor-sidebar">
        <div class="sidebar-header">
          <h2 style="font-family: 'Outfit', sans-serif; font-size: 1.1rem;">BCU Editor <span style="font-size: 0.6rem; opacity: 0.5;">v1.1.0-FIX</span></h2>
          <div style="font-size: 0.65rem; color: #10b981; margin-top: 0.2rem;" id="engine-status">Engine Loading...</div>
        </div>

        <div class="tab-container">
          <button class="tab-btn active" id="tab-model">MODEL</button>
          <button class="tab-btn" id="tab-imgcut">IMGCUT</button>
          <button class="tab-btn" id="tab-files">FILES</button>
        </div>

        <div class="sidebar-content">
          <!-- Files View -->
          <div id="view-files" style="display: none;">
            <div id="file-explorer"></div>
          </div>

          <!-- Model View -->
          <div id="view-model-anim">
            <div style="display: flex; gap: 8px; margin-bottom: 1.5rem;">
              <button id="btn-load-sample" class="action-btn primary-btn" style="flex: 1; font-size: 0.75rem;">
                Load Sample
              </button>
              <button id="btn-run-diagnostics" class="action-btn secondary-btn" style="flex: 1; font-size: 0.75rem;">
                Diagnostics
              </button>
            </div>

            <div style="margin-bottom: 1.5rem;">
              <h3 style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Active Animation</h3>
              <select id="anim-selector" style="width: 100%; padding: 0.4rem; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.75rem;">
                <option value="walk">Walk</option>
                <option value="idle">Idle</option>
                <option value="attack">Attack</option>
                <option value="kb">KB</option>
              </select>
            </div>

            <h3 style="font-size: 0.8rem; margin-bottom: 0.6rem; color: var(--text-secondary);">Parts Tree</h3>
            <div id="parts-list" style="overflow-y: auto; max-height: calc(100vh - 450px);"></div>
          </div>

          <!-- ImgCut View -->
          <div id="view-imgcut" style="display: none;">
            <h3 style="font-size: 0.8rem; margin-bottom: 0.6rem; color: var(--text-secondary);">Image Cuts</h3>
            <div id="imgcut-list"></div>
          </div>
        </div>

        <div class="logger-console" id="logger-console"></div>
      </aside>

      <!-- Main Viewport -->
      <main class="viewport-container" id="drop-zone">
        <div class="drag-overlay" id="drag-overlay">
          <div style="text-align: center;">
            <div style="font-size: 2rem; margin-bottom: 1rem;">📂</div>
            <div style="font-weight: 600;">Drop Animation Folder</div>
          </div>
        </div>
        <div class="canvas-wrapper">
          <canvas id="bcu-canvas"></canvas>
          <canvas id="gizmo-canvas" style="position: absolute; top: 0; left: 0; pointer-events: none;"></canvas>
          <canvas id="imgcut-canvas" style="position: absolute; top: 0; left: 0; display: none; background: #1a1a1a;"></canvas>
        </div>

        <footer class="control-bar">
          <button class="play-btn" id="btn-play-pause">▶</button>
          <div class="timeline-container">
            <input type="range" class="frame-slider" id="frame-slider" min="0" max="100" value="0">
            <div id="timeline-keyframes" style="height: 14px; position: relative; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; margin: 2px 0;"></div>
            <div style="display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-secondary);">
              <span id="current-frame-label">Frame: 0</span>
              <span id="max-frame-label">Max: 0</span>
            </div>
          </div>
        </footer>
      </main>

      <!-- Right Sidebar -->
      <aside class="editor-sidebar sidebar-right">
        <div class="sidebar-header">
          <h3 style="font-size: 0.9rem;">Project Settings</h3>
        </div>
        <div class="sidebar-content">
          <div style="margin-bottom: 1.5rem;">
            <h4 style="font-size: 0.7rem; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase;">Project Name</h4>
            <input type="text" id="input-project-name" value="New Project" 
                   style="width: 100%; padding: 0.6rem; background: rgba(0,0,0,0.3); color: white; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.8rem; outline: none;">
          </div>

          <div id="property-inspector">
            <div style="font-size: 0.75rem; color: var(--text-secondary); text-align: center; margin-top: 2rem;">Select a part to edit</div>
          </div>
          
          <div style="margin-top: 2rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
            <p style="font-size: 0.6rem; color: var(--text-secondary); margin-bottom: 0.75rem; line-height: 1.4;">
              Exported as <b>.tar</b> for high performance. Most archive tools (7-Zip, WinRAR) handle it exactly like a .zip.
            </p>
            <button id="btn-export-tar" style="width: 100%; padding: 0.7rem; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600;">
              Export Project (.tar)
            </button>
          </div>
        </div>
      </aside>
    </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
