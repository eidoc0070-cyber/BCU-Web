[package]
name = "bcu-api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcu-core = { workspace = true }
bcu-render = { workspace = true }
bcu-assets = { workspace = true }
bcu-math = { workspace = true }
bcu-parser = { workspace = true }
wgpu = { version = "0.19", features = ["webgl"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
log = "0.4"
wasm-bindgen-futures = "0.4"
